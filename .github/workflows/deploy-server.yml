name: Build and Deploy API (Dev)

on:
  push:
    branches: [dev]
    paths:
      - 'marketing-server/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yyu-wang/marketing-server

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./marketing-server
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-api
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          sudo cp marketing-server/docker-compose.prod.yml /opt/copywise/docker-compose.prod.yml
          cd /opt/copywise
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo docker compose -f docker-compose.prod.yml pull api
          sudo docker compose -f docker-compose.prod.yml stop api
          sudo docker compose -f docker-compose.prod.yml rm -f api
          sudo docker compose -f docker-compose.prod.yml up -d --no-deps api
