name: Build and Deploy Admin (Dev)

on:
  push:
    branches: [dev]
    paths:
      - 'copywise-admin/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yyu-wang/marketing-copywise-admin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./copywise-admin
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy Admin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          cd /opt/copywise
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo docker compose -f docker-compose.prod.yml stop admin
          sudo docker compose -f docker-compose.prod.yml rm -f admin
          sudo docker compose -f docker-compose.prod.yml pull admin
          sudo docker compose -f docker-compose.prod.yml up -d --no-deps admin
