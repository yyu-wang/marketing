# =============================================================================
# Marketing Wise 本地编排（含前后端）
#
# 本地开发（仅基础设施）：
#   docker compose up -d                    # MySQL + Redis
#   npm run start:dev                       # NestJS 热重载，端口 3000
#
# 全容器启动（含应用 + 前端）：
#   docker compose --profile full up -d     # 全部服务
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: marketing-wise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: copywise_root
      MYSQL_DATABASE: copywise
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - '3306:3306'
    volumes:
      - marketing-wise-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: marketing-wise-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - marketing-wise-redis-data:/data

  api:
    profiles:
      - full
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing-wise-api
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports:
      - '3000:3000'
    volumes:
      # 上传图片落本地磁盘，挂出来便于回看与备份
      - marketing-wise-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    profiles:
      - full
    build:
      context: ../copywise-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_APP_TITLE: "Marketing Wise 智能营销文案助手"
    container_name: marketing-wise-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'

volumes:
  marketing-wise-mysql-data:
  marketing-wise-redis-data:
  marketing-wise-uploads:
